name: Deploy c-send library to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build library site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/api _site/datasets/jp _site/datasets/en
          cp scripts/library-site/index.html _site/index.html
          python scripts/library-site/generate_catalog.py --output _site
          cp api/*.json _site/api/
          cp samples/jp/*.json _site/datasets/jp/
          cp samples/en/*.json _site/datasets/en/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
